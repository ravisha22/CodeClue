_lazy_sha1:
  preconditions: []
  postconditions:
    - type: return_value
      target: "hash object"
      description: "Returns hashlib.sha1 hash object, deferring access until runtime for FIPS compatibility"
  failure_modes: []
  complexity_indicators:
    uses_reflection: false
    uses_generics: false
    uses_dynamic_dispatch: false
    uses_metaprogramming: false

SecureCookieSessionInterface.get_signing_serializer:
  preconditions:
    - type: config_required
      target: "app.secret_key"
      constraint: "Must be set for signing to work"
  postconditions:
    - type: return_value
      target: "URLSafeTimedSerializer | None"
      description: "Returns a configured URLSafeTimedSerializer with the secret key and fallback keys, or None if no secret_key"
  failure_modes: []
  complexity_indicators:
    uses_reflection: false
    uses_generics: false
    uses_dynamic_dispatch: false
    uses_metaprogramming: false

SecureCookieSessionInterface.open_session:
  preconditions:
    - type: config_required
      target: "app.secret_key"
      constraint: "Must be set for session to be opened (returns None otherwise)"
  postconditions:
    - type: return_value
      target: "SecureCookieSession | None"
      description: "Returns None if no signing serializer, empty session if no cookie, deserialized session from cookie, or empty session on bad signature"
  failure_modes: []
  complexity_indicators:
    uses_reflection: false
    uses_generics: false
    uses_dynamic_dispatch: false
    uses_metaprogramming: false

SecureCookieSessionInterface.save_session:
  preconditions:
    - type: parameter_valid
      target: "response"
      constraint: "Must be a Response instance"
  postconditions:
    - type: side_effect
      target: "response"
      description: "Sets or deletes the session cookie on the response based on session state. Adds Vary: Cookie header if session was accessed."
    - type: state_mutation
      target: "response.headers"
      description: "Modifies Set-Cookie and Vary headers"
  failure_modes: []
  complexity_indicators:
    uses_reflection: false
    uses_generics: false
    uses_dynamic_dispatch: true
    uses_metaprogramming: false
