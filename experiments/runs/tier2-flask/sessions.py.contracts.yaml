  preconditions: []
  postconditions:
    - type: state_mutation
      target: "self['_permanent']"
      description: "Sets the '_permanent' key to bool(value)"
  failure_modes: []
  complexity_indicators:
    uses_reflection: false
    uses_generics: false
    uses_dynamic_dispatch: false
    uses_metaprogramming: false

SecureCookieSession.__init__:
