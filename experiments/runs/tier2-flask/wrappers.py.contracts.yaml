Request.max_content_length:
  preconditions: []
  postconditions:
    - type: return_value
      target: "int | None"
      description: "Returns per-request override if set, falls back to parent class if no current_app, otherwise returns MAX_CONTENT_LENGTH config"
  failure_modes: []
  complexity_indicators:
    uses_reflection: false
    uses_generics: false
    uses_dynamic_dispatch: false
    uses_metaprogramming: false

Request.max_content_length.setter:
  preconditions: []
  postconditions:
    - type: state_mutation
      target: "self._max_content_length"
      description: "Sets the per-request max content length override"
  failure_modes: []
  complexity_indicators:
    uses_reflection: false
    uses_generics: false
    uses_dynamic_dispatch: false
    uses_metaprogramming: false

